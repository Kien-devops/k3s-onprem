---
- name: Minimal preflight
  ansible.builtin.import_playbook: preflight.yml

- name: Minimal host baseline
  ansible.builtin.import_playbook: baseline.yml

- name: Start stable K3s API endpoint
  ansible.builtin.import_playbook: haproxy-api.yml

- name: Deploy K3s cluster
  ansible.builtin.import_playbook: cluster.yml

- name: Configure worker ingress placement
  ansible.builtin.import_playbook: addons.yml

- name: Enable application ingress endpoint
  ansible.builtin.import_playbook: haproxy-ingress.yml

- name: Deploy and verify smoke test
  ansible.builtin.import_playbook: smoke-test.yml

- name: Validate lab
  ansible.builtin.import_playbook: validate.yml
