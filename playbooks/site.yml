---
- name: 1 | Preflight and minimum host baseline
  hosts: all
  gather_facts: true
  become: false
  tags: [preflight]
  roles:
    - role: preflight

- name: 2 | Establish the stable Kubernetes API endpoint
  hosts: load_balancers
  gather_facts: false
  become: false
  tags: [haproxy, api]
  vars:
    haproxy_enable_ingress: false
  roles:
    - role: haproxy

- name: 3 | Converge the K3s control plane
  hosts: control_plane
  gather_facts: true
  become: true
  tags: [k3s, control_plane]
  roles:
    - role: k3s_control_plane

- name: 4 | Converge K3s workers
  hosts: workers
  gather_facts: true
  become: true
  tags: [k3s, workers]
  roles:
    - role: k3s_worker

- name: 5 | Converge cluster addons
  hosts: control_plane
  gather_facts: false
  become: true
  tags: [k3s, addons]
  roles:
    - role: k3s_addons

- name: 6 | Enable the application ingress entry points
  hosts: load_balancers
  gather_facts: false
  become: false
  tags: [haproxy, ingress]
  vars:
    haproxy_enable_ingress: true
  roles:
    - role: haproxy

- name: 7 | Deploy and test the smoke application
  ansible.builtin.import_playbook: smoke-test.yml
  tags: [smoke_test]

- name: 8 | Validate the complete homelab
  ansible.builtin.import_playbook: validate.yml
  tags: [validation]
