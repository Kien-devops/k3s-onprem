---
- name: Remove the lost-cluster K3s agent state from the new control plane
  hosts: control_plane
  gather_facts: true
  become: true
  vars:
    k3s_rebuild_leftover_paths:
      - /etc/rancher/k3s
      - /var/lib/rancher/k3s
      - /var/lib/kubelet
      - /etc/systemd/system/k3s-agent.service
      - /etc/systemd/system/k3s-agent.service.env
      - /run/k3s
      - /run/flannel
      - /var/lib/cni
      - /etc/cni
      - /opt/cni
    k3s_rebuild_network_interfaces:
      - cni0
      - flannel.1
      - kube-ipvs0
  tasks:
    - name: Require explicit approval for the destructive rebuild
      ansible.builtin.assert:
        that:
          - confirm_k3s_rebuild | default(false) | bool
        fail_msg: >-
          Re-run with -e confirm_k3s_rebuild=true only after confirming the
          previous control plane and SQLite datastore are permanently lost.

    - name: Verify this is the expected replacement control-plane host
      ansible.builtin.assert:
        that:
          - inventory_hostname == k3s_control_plane_name
          - ansible_host == '192.168.30.35'
          - lan_interface in ansible_facts['interfaces']
        fail_msg: Refusing cleanup because inventory or host identity is unexpected.

    - name: Read service state before cleanup
      ansible.builtin.service_facts:

    - name: Refuse to clean a host that already runs a K3s server
      ansible.builtin.assert:
        that:
          - ansible_facts.services['k3s.service'] is not defined
        fail_msg: A K3s server already exists; this one-time agent cleanup is no longer applicable.

    - name: Check for unrelated container runtime services
      ansible.builtin.command: systemctl is-active {{ item }}
      loop:
        - docker
        - crio
        - containerd
      register: k3s_rebuild_runtime_checks
      failed_when: false
      changed_when: false

    - name: Refuse cleanup when an unrelated container runtime is active
      ansible.builtin.assert:
        that:
          - >-
            k3s_rebuild_runtime_checks.results
            | selectattr('rc', 'equalto', 0)
            | list
            | length == 0
        fail_msg: >-
          An unrelated Docker, CRI-O, or standalone containerd service is active.
          Inspect workloads before removing K3s state.

    - name: Inspect the official K3s agent uninstall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: k3s_rebuild_uninstall_script

    - name: Require the official uninstall script for the old agent
      ansible.builtin.assert:
        that:
          - k3s_rebuild_uninstall_script.stat.exists
        fail_msg: >-
          The official k3s-agent-uninstall.sh script is absent. Stop for manual
          review instead of deleting an unknown installation blindly.

    - name: Run the official K3s agent uninstall script
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      changed_when: true

    - name: Remove only known K3s leftovers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ k3s_rebuild_leftover_paths }}"

    - name: Inspect known K3s network interfaces
      ansible.builtin.command: ip link show {{ item }}
      loop: "{{ k3s_rebuild_network_interfaces }}"
      register: k3s_rebuild_interface_checks
      failed_when: false
      changed_when: false

    - name: Remove remaining K3s network interfaces
      ansible.builtin.command: ip link delete {{ item.item }}
      loop: "{{ k3s_rebuild_interface_checks.results }}"
      when: item.rc == 0
      changed_when: true

    - name: Reload systemd after agent removal
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Verify the old agent process is gone
      ansible.builtin.command: pgrep -af '[k]3s agent'
      register: k3s_rebuild_agent_process
      failed_when: k3s_rebuild_agent_process.rc == 0
      changed_when: false
