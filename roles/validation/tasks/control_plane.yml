---
- name: Wait for both Kubernetes nodes to be Ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=Ready
    node/{{ validation_control_plane_name }}
    node/{{ validation_worker_name }}
    --timeout={{ validation_node_ready_timeout }}
  changed_when: false

- name: Read Kubernetes node state
  ansible.builtin.command: k3s kubectl get nodes -o wide
  register: validation_nodes
  changed_when: false

- name: Show Kubernetes node state
  ansible.builtin.debug:
    var: validation_nodes.stdout_lines

- name: Read Kubernetes nodes as structured data
  ansible.builtin.command: k3s kubectl get nodes -o json
  register: validation_nodes_raw
  changed_when: false

- name: Assert the cluster contains the dedicated control plane and worker
  vars:
    validation_node_items: "{{ (validation_nodes_raw.stdout | from_json)['items'] }}"
    validation_control_plane_node: >-
      {{ validation_node_items
         | selectattr('metadata.name', 'equalto', validation_control_plane_name)
         | first }}
    validation_worker_node: >-
      {{ validation_node_items
         | selectattr('metadata.name', 'equalto', validation_worker_name)
         | first }}
  ansible.builtin.assert:
    that:
      - validation_node_items | length == 2
      - >-
        (validation_node_items | map(attribute='metadata.name') | sort | list)
        == ([validation_control_plane_name, validation_worker_name] | sort)
      - validation_control_plane_node.spec.taints | default([]) | selectattr('effect', 'equalto', 'NoSchedule') | list | length > 0
      - validation_worker_node.spec.taints | default([]) | selectattr('effect', 'equalto', 'NoSchedule') | list | length == 0
      - validation_worker_node.metadata.labels['svccontroller.k3s.cattle.io/enablelb'] == 'true'
      - validation_worker_node.metadata.labels['svccontroller.k3s.cattle.io/lbpool'] == 'ingress'
    fail_msg: >-
      The cluster must contain dedicated control plane
      {{ validation_control_plane_name }} and schedulable worker
      {{ validation_worker_name }}.

- name: Read Traefik pods
  ansible.builtin.command: >-
    k3s kubectl -n kube-system get pods
    -l app.kubernetes.io/name=traefik -o json
  register: validation_traefik_raw
  changed_when: false

- name: Assert Traefik is Running on the workload node
  vars:
    validation_traefik_pods: "{{ (validation_traefik_raw.stdout | from_json)['items'] }}"
  ansible.builtin.assert:
    that:
      - validation_traefik_pods | length > 0
      - validation_traefik_pods | map(attribute='spec.nodeName') | unique | list == [validation_workload_node_name]
      - validation_traefik_pods | map(attribute='status.phase') | unique | list == ['Running']
    fail_msg: Traefik is not Running exclusively on the workload node.

- name: Read Traefik ServiceLB pods
  ansible.builtin.command: >-
    k3s kubectl -n kube-system get pods
    -l svccontroller.k3s.cattle.io/svcname=traefik -o json
  register: validation_servicelb_raw
  changed_when: false

- name: Assert ServiceLB is Running on the workload node
  vars:
    validation_servicelb_pods: "{{ (validation_servicelb_raw.stdout | from_json)['items'] }}"
  ansible.builtin.assert:
    that:
      - validation_servicelb_pods | length > 0
      - validation_servicelb_pods | map(attribute='spec.nodeName') | unique | list == [validation_workload_node_name]
      - validation_servicelb_pods | map(attribute='status.phase') | unique | list == ['Running']
    fail_msg: Traefik ServiceLB is not Running exclusively on the workload node.

- name: Read smoke-test pods
  ansible.builtin.command: >-
    k3s kubectl -n {{ validation_smoke_namespace }} get pods
    -l {{ validation_smoke_label }} -o json
  register: validation_smoke_raw
  changed_when: false

- name: Assert the smoke workload is Running on the workload node
  vars:
    validation_smoke_pods: "{{ (validation_smoke_raw.stdout | from_json)['items'] }}"
  ansible.builtin.assert:
    that:
      - validation_smoke_pods | length > 0
      - validation_smoke_pods | map(attribute='spec.nodeName') | unique | list == [validation_workload_node_name]
      - validation_smoke_pods | map(attribute='status.phase') | unique | list == ['Running']
    fail_msg: The smoke-test workload is not Running on the workload node.
