---
- name: Inspect the K3s server binary
  ansible.builtin.stat:
    path: "{{ k3s_control_plane_binary }}"
  register: k3s_control_plane_binary_stat

- name: Read the installed K3s server version
  ansible.builtin.command: "{{ k3s_control_plane_binary }} --version"
  register: k3s_control_plane_version
  changed_when: false
  when: k3s_control_plane_binary_stat.stat.exists

- name: Inspect the K3s server configuration
  ansible.builtin.stat:
    path: "{{ k3s_control_plane_config }}"
  register: k3s_control_plane_config_stat

- name: Read the K3s server configuration
  ansible.builtin.slurp:
    path: "{{ k3s_control_plane_config }}"
  register: k3s_control_plane_config_raw
  when: k3s_control_plane_config_stat.stat.exists

- name: Read K3s service state
  ansible.builtin.service_facts:

- name: Determine whether upstream server convergence is required
  ansible.builtin.set_fact:
    k3s_control_plane_converge_required: >-
      {{
        not k3s_control_plane_binary_stat.stat.exists
        or k3s_version not in (k3s_control_plane_version.stdout | default(''))
        or not k3s_control_plane_config_stat.stat.exists
        or (
          (k3s_control_plane_config_raw.content | default('') | b64decode | from_yaml)
          != (server_config_yaml | from_yaml)
        )
        or ansible_facts.services['k3s.service'] is not defined
        or ansible_facts.services['k3s.service'].state != 'running'
      }}

- name: Install or reconcile K3s with the upstream server role
  ansible.builtin.include_role:
    name: k3s.orchestration.k3s_server
  when: k3s_control_plane_converge_required

- name: Read the K3s node token for worker convergence
  ansible.builtin.slurp:
    path: "{{ k3s_control_plane_token }}"
  register: k3s_control_plane_token_raw
  no_log: true

- name: Expose the node token to the worker role
  ansible.builtin.set_fact:
    random_token: "{{ k3s_control_plane_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Create the controller kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch the original admin kubeconfig to the controller
  ansible.builtin.fetch:
    src: "{{ k3s_control_plane_remote_kubeconfig }}"
    dest: "{{ k3s_control_plane_source_kubeconfig }}"
    flat: true

- name: Restrict the source kubeconfig on the controller
  ansible.builtin.file:
    path: "{{ k3s_control_plane_source_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Build an idempotent kubeconfig for the HAProxy API endpoint
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', k3s_control_plane_source_kubeconfig)
         | regex_replace('server: https://127\\.0\\.0\\.1:6443',
                         'server: https://' ~ api_endpoint ~ ':' ~ api_port) }}
    dest: "{{ kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: Wait for the K3s API through HAProxy
  ansible.builtin.wait_for:
    host: "{{ api_endpoint }}"
    port: "{{ api_port }}"
    timeout: "{{ k3s_control_plane_api_wait_timeout }}"
  delegate_to: localhost
  become: false
