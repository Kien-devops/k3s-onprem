---
- name: Install the Traefik ServiceLB pool configuration
  ansible.builtin.template:
    src: "{{ k3s_addons_traefik_source }}"
    dest: "{{ k3s_addons_traefik_destination }}"
    owner: root
    group: root
    mode: "0644"

- name: Wait for the K3s Helm controller to apply the highly available Traefik placement
  ansible.builtin.command: k3s kubectl -n kube-system get deployment traefik -o json
  register: k3s_addons_traefik_deployment
  changed_when: false
  retries: 30
  delay: 5
  until:
    - k3s_addons_traefik_deployment.rc == 0
    - >-
      ((k3s_addons_traefik_deployment.stdout | from_json)['spec'].get('replicas', 0) | int)
      == (k3s_addons_expected_nodes | length)
    - >-
      ((k3s_addons_traefik_deployment.stdout | from_json)['spec']['template']['spec'].get('nodeSelector', {})).get('onprem.site/ingress', '') == 'true'

- name: Wait for the Traefik deployment
  ansible.builtin.command: >-
    k3s kubectl -n kube-system rollout status deployment/traefik
    --timeout={{ k3s_addons_rollout_timeout }}
  changed_when: false

- name: Read Traefik pods
  ansible.builtin.command: >-
    k3s kubectl -n kube-system get pods
    -l app.kubernetes.io/name=traefik -o json
  register: k3s_addons_traefik_pods_raw
  retries: 18
  delay: 5
  until:
    - ((k3s_addons_traefik_pods_raw.stdout | from_json)['items'] | length) == (k3s_addons_expected_nodes | length)
    - >-
      ((k3s_addons_traefik_pods_raw.stdout | from_json)['items']
      | map(attribute='spec.nodeName') | unique | sort | list)
      == (k3s_addons_expected_nodes | sort)
    - ((k3s_addons_traefik_pods_raw.stdout | from_json)['items'] | map(attribute='status.phase') | unique | list) == ['Running']
  changed_when: false

- name: Verify Traefik placement
  vars:
    k3s_addons_traefik_pods: "{{ (k3s_addons_traefik_pods_raw.stdout | from_json)['items'] }}"
  ansible.builtin.assert:
    that:
      - k3s_addons_traefik_pods | length == k3s_addons_expected_nodes | length
      - >-
        (k3s_addons_traefik_pods | map(attribute='spec.nodeName') | unique | sort | list)
        == (k3s_addons_expected_nodes | sort)
      - k3s_addons_traefik_pods | map(attribute='status.phase') | unique | list == ['Running']
    fail_msg: >-
      Traefik must have one Running replica on every ingress worker:
      {{ k3s_addons_expected_nodes | join(', ') }}.

- name: Read Traefik ServiceLB pods
  ansible.builtin.command: >-
    k3s kubectl -n kube-system get pods
    -l svccontroller.k3s.cattle.io/svcname=traefik -o json
  register: k3s_addons_servicelb_pods_raw
  retries: 18
  delay: 5
  until:
    - ((k3s_addons_servicelb_pods_raw.stdout | from_json)['items'] | length) == (k3s_addons_expected_nodes | length)
    - >-
      ((k3s_addons_servicelb_pods_raw.stdout | from_json)['items']
      | map(attribute='spec.nodeName') | unique | sort | list)
      == (k3s_addons_expected_nodes | sort)
    - ((k3s_addons_servicelb_pods_raw.stdout | from_json)['items'] | map(attribute='status.phase') | unique | list) == ['Running']
  changed_when: false

- name: Verify ServiceLB placement
  vars:
    k3s_addons_servicelb_pods: "{{ (k3s_addons_servicelb_pods_raw.stdout | from_json)['items'] }}"
  ansible.builtin.assert:
    that:
      - k3s_addons_servicelb_pods | length == k3s_addons_expected_nodes | length
      - >-
        (k3s_addons_servicelb_pods | map(attribute='spec.nodeName') | unique | sort | list)
        == (k3s_addons_expected_nodes | sort)
      - k3s_addons_servicelb_pods | map(attribute='status.phase') | unique | list == ['Running']
    fail_msg: >-
      Traefik ServiceLB must be Running on every ingress worker:
      {{ k3s_addons_expected_nodes | join(', ') }}.
