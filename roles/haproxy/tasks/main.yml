---
- name: Create HAProxy configuration directory
  ansible.builtin.file:
    path: "{{ haproxy_config_dir }}"
    state: directory
    mode: "0755"

- name: Render HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_dir }}/haproxy.cfg"
    mode: "0644"
  register: haproxy_config

- name: Check pinned HAProxy image
  ansible.builtin.command: docker image inspect {{ haproxy_image }}
  register: haproxy_image_check
  failed_when: false
  changed_when: false

- name: Pull pinned HAProxy image
  ansible.builtin.command: docker pull {{ haproxy_image }}
  when: haproxy_image_check.rc != 0
  changed_when: true

- name: Validate HAProxy configuration
  ansible.builtin.command: >-
    docker run --rm
    -v {{ haproxy_config_dir }}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    {{ haproxy_image }}
    haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
  changed_when: false

- name: Check HAProxy container
  ansible.builtin.command: docker container inspect {{ haproxy_container_name }}
  register: haproxy_container_check
  failed_when: false
  changed_when: false

- name: Remove HAProxy container when configuration changed
  ansible.builtin.command: docker rm -f {{ haproxy_container_name }}
  when:
    - haproxy_container_check.rc == 0
    - haproxy_config.changed
  changed_when: true

- name: Start HAProxy container
  ansible.builtin.command: >-
    docker run -d
    --name {{ haproxy_container_name }}
    --restart unless-stopped
    --network host
    --user 0:0
    -v {{ haproxy_config_dir }}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    {{ haproxy_image }}
  when: haproxy_container_check.rc != 0 or haproxy_config.changed
  changed_when: true

- name: Wait for Kubernetes API frontend
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 30
